<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Banner</title>
  <!-- Not a test page: `npm run screenshots` takes `docs/intro.png` from it, with the real panel on the video. The
       screenshot test adds the logo and the fonts, which the test server can't serve. -->
  <style>
    body { margin: 0; width: 1022px; height: 575px; overflow: hidden; font-family: "Salsa", cursive; color: #2b2118; }
    /* Bigger than the window, so the resize handle on its bottom right corner is out of the picture. */
    #player { position: relative; width: 1100px; height: 640px; background: black; }
    #player video { width: 100%; height: 100%; display: block; }
    /* A painted scene covers the test clip, which is only 160×90 px. */
    #scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: linear-gradient(#8fc8f5, #d9eefc 55%, #f3f8ee 70%);
    }
    .cloud { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.85); filter: blur(6px); }
    .hill { position: absolute; border-radius: 50%; }
    #title { position: absolute; left: 48px; top: 150px; }
    h1 { margin: 0; font-size: 62px; font-weight: 400; line-height: 1.05; }
    p { margin: 22px 0 0; font-size: 30px; line-height: 1.3; }
    #logo {
      position: absolute;
      right: 60px;
      top: 120px;
      width: 300px;
      height: 300px;
      border: 6px solid #fc9e64;
      border-radius: 50%;
      box-shadow: 0 12px 40px rgba(43, 33, 24, 0.25);
    }
    /* Like a player's controls, so the scene reads as a video. */
    #bar { position: absolute; left: 24px; right: 24px; bottom: 26px; height: 5px; background: rgba(255, 255, 255, 0.5); border-radius: 3px; }
    #bar::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 34%; background: #ffdb00; border-radius: 3px; }
    #shade { position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: linear-gradient(transparent, rgba(0, 0, 0, 0.35)); }
  </style>
</head>
<body>
  <div id="player">
    <video src="clip.webm" muted playsinline></video>
    <div id="scene">
      <div class="cloud" style="left: 420px; top: 40px; width: 220px; height: 70px"></div>
      <div class="cloud" style="left: 520px; top: 70px; width: 160px; height: 60px"></div>
      <div class="cloud" style="left: 760px; top: 20px; width: 200px; height: 60px"></div>
      <div class="hill" style="left: -200px; top: 400px; width: 900px; height: 420px; background: #9ccc65"></div>
      <div class="hill" style="left: 450px; top: 430px; width: 900px; height: 420px; background: #7cb342"></div>
      <div class="hill" style="left: -100px; top: 480px; width: 1300px; height: 400px; background: #689f38"></div>
      <div id="title">
        <h1>Control the speed<br />of any video</h1>
        <p>Seek, step frames, loop, volume,<br />resize and picture-in-picture.</p>
      </div>
      <img id="logo" alt="" />
      <div id="shade"></div>
      <div id="bar"></div>
    </div>
  </div>
</body>
</html>
