<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Store images</title>
  <!-- Not a test page: `npm run screenshots` takes the store images in `docs/store` from it. The part after `#` picks
       the image. Sizes are in CSS pixels at half the store's size, since the pictures are taken at 2×. The screenshot
       test adds the logo, the popup picture and the fonts, which the test server can't serve. -->
  <style>
    body { margin: 0; width: 100vw; height: 100vh; overflow: clip; font-family: "Salsa", cursive; color: #2b2118; }
    /* Bigger than the window, so the resize handle on its bottom right corner is out of the picture. */
    #player { position: relative; width: calc(100vw + 80px); height: calc(100vh + 80px); background: black; }
    #player video { width: 100%; height: 100%; display: block; }
    /* The small tile is too small for the panel. A video out of view gets none. */
    .tile #player { position: absolute; left: -5000px; }
    /* A painted scene covers the test clip, which is only 160×90 px. */
    #scene {
      position: fixed;
      inset: 0;
      /* Not `hidden`: focusing the panel scrolled the hills up into view. */
      overflow: clip;
      background: linear-gradient(#8fc8f5, #d9eefc 55%, #f3f8ee 70%);
    }
    .cloud { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.85); filter: blur(4px); }
    .hill { position: absolute; border-radius: 50%; }
    /* Like a player's controls, so the scene reads as a video. */
    #bar { position: absolute; left: 14px; right: 14px; bottom: 14px; height: 3px; background: rgba(255, 255, 255, 0.5); border-radius: 2px; }
    #bar::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 34%; background: #ffdb00; border-radius: 2px; }
    #shade { position: absolute; left: 0; right: 0; bottom: 0; height: 50px; background: linear-gradient(transparent, rgba(0, 0, 0, 0.35)); }
    .tile #bar, .tile #shade { display: none; }

    #text { position: absolute; left: 30px; top: 50%; transform: translateY(-50%); }
    h1 { margin: 0; font-size: 36px; font-weight: 400; line-height: 1.05; }
    p { margin: 12px 0 0; font-size: 17px; line-height: 1.3; }
    p:empty { display: none; }
    #logo {
      position: absolute;
      right: 36px;
      top: 50%;
      width: 190px;
      height: 190px;
      transform: translateY(-50%);
      border: 4px solid #fc9e64;
      border-radius: 50%;
      box-shadow: 0 8px 26px rgba(43, 33, 24, 0.25);
    }
    #popup { display: none; }
    #keys { display: none; }

    /* 1400×560 */
    .marquee #logo { right: 48px; }

    /* 440×280 */
    .tile h1 { font-size: 23px; }
    .tile #text { left: auto; right: 12px; }
    .tile #logo { left: 12px; right: auto; width: 96px; height: 96px; border-width: 3px; }
    .tile p { display: none; }

    /* 1280×800 */
    .speed #text { top: 52%; }
    .speed h1 { font-size: 42px; }
    .speed p { font-size: 20px; }
    .speed #logo { width: 220px; height: 220px; right: 40px; top: 54%; }

    .popup #logo { display: none; }
    .keys #text { top: 54%; }
    .keys #keys { display: grid; grid-template-columns: max-content max-content; gap: 10px 14px; align-items: center; margin-top: 20px; }
    .keys #keys span:nth-child(odd) { display: flex; gap: 6px; }
    .keys #keys span:nth-child(even) { font-size: 19px; }
    kbd {
      display: inline-block;
      min-width: 30px;
      padding: 3px 0 5px;
      font: 500 17px/1 "Roboto Condensed", sans-serif;
      text-align: center;
      background: #fffdf3;
      border: 1px solid #c9b98e;
      border-bottom-width: 3px;
      border-radius: 6px;
    }

    .popup #text { top: 54%; }
    .popup #popup {
      display: block;
      position: absolute;
      right: 44px;
      top: 50%;
      height: 340px;
      z-index: 1;
      transform: translateY(-50%);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(43, 33, 24, 0.3);
    }
  </style>
</head>
<body>
  <div id="player">
    <video src="clip.webm" muted playsinline></video>
    <div id="scene">
      <div class="cloud" style="left: 41%; top: 7%; width: 22%; height: 12%"></div>
      <div class="cloud" style="left: 51%; top: 12%; width: 16%; height: 10%"></div>
      <div class="cloud" style="left: 74%; top: 3%; width: 20%; height: 10%"></div>
      <div class="hill" style="left: -20%; top: 70%; width: 88%; height: 73%; background: #9ccc65"></div>
      <div class="hill" style="left: 44%; top: 75%; width: 88%; height: 73%; background: #7cb342"></div>
      <div class="hill" style="left: -10%; top: 84%; width: 127%; height: 70%; background: #689f38"></div>
      <div id="text">
        <h1>Bee fast video</h1>
        <p></p>
        <div id="keys">
          <span><kbd>Z</kbd><kbd>X</kbd></span><span>slower, faster</span>
          <span><kbd>A</kbd><kbd>D</kbd></span><span>back, forward 5 s</span>
          <span><kbd>S</kbd></span><span>play, pause</span>
          <span><kbd>Q</kbd><kbd>E</kbd></span><span>frame by frame</span>
        </div>
      </div>
      <img id="logo" alt="" />
      <img id="popup" alt="" />
      <div id="shade"></div>
      <div id="bar"></div>
    </div>
  </div>
  <script>
    const layout = location.hash.slice(1)
    document.body.className = layout
    const text = {
      marquee: ["Control the speed<br>of any video", "Seek, step frames, loop,<br>volume and resize."],
      tile: ["Bee fast<br>video", ""],
      speed: ["Control the speed<br>of any video", "On any site. Seek, step frames,<br>loop, volume and resize."],
      keys: ["Keys for everything", ""],
      popup: ["Set it up<br>per site", "Remember your speed,<br>fit videos to the window,<br>or turn it off.<br>Change any key."],
    }[layout]
    document.querySelector("h1").innerHTML = text[0]
    document.querySelector("p").innerHTML = text[1]
  </script>
</body>
</html>
