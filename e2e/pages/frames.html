<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Frames</title>
  <style>iframe { width: 400px; height: 260px; border: 0; display: block; margin: 8px; }</style>
</head>
<body>
  <!-- An iframe without an address of its own; `srcdoc` pages resolve relative URLs against this page. -->
  <iframe id="srcdoc" title="srcdoc player" srcdoc="<video src='clip.webm' muted style='width: 320px; height: 180px'></video>"></iframe>
  <!-- An about:blank iframe filled in by script, like some embedded players. -->
  <iframe id="blank" title="about:blank player"></iframe>
  <script>
    const doc = document.getElementById("blank").contentDocument
    doc.body.innerHTML = `<video src="${new URL("clip.webm", location.href)}" muted style="width: 320px; height: 180px"></video>`
  </script>
</body>
</html>
